seed: 2026

model:
  in_channels: 3
  base_dim: 48
  encoder_depths: [2, 3, 3]
  deep_semantic_depth: 3
  decoder_depths: [3, 2]
  heads: [1, 2, 4]
  expansion: 2.66
  scta_kernel: 3

training:
  train_input_dir: "data/trainA"
  train_target_dir: "data/trainB"
  val_input_dir: "data/valA"
  val_target_dir: "data/valB"
  patch_size: 256
  batch_size: 4
  epochs: 200
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  edge_weight: 0.05
  fft_weight: 0.01
  output_dir: "outputs/paper_hgcnet"
